# Nginx do frontend. Mesma origem para front e API => cookies SameSite=strict funcionam.
#
# NOTA: `limit_req_zone` só é válido no contexto `http`. Como este arquivo é
# incluído em `conf.d/` (que o nginx carrega DENTRO do `http`), o zone pode ser
# declarado aqui — mas nunca dentro de `server {}`.

# Rate limit na borda (complementa os limiters da aplicação).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream sano_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Módulo de mensagens: a mídia já cifrada chega em base64 no corpo do POST.
    # O padrão (1m) barraria imagem e áudio; o teto da aplicação é 4 MB.
    client_max_body_size 6m;

    # Áudio de ~2 min leva tempo em VPS modesto.
    client_body_timeout 120s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # `microphone` fica LIGADO: o gravador de áudio do módulo de mensagens usa
    # getUserMedia. Negar aqui quebraria o envio de áudio silenciosamente.
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(self)" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://sano_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
    }

    # SPA: rotas do React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets com hash podem ser cacheados para sempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
    }
}