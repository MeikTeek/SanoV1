<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sano</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f14; color: #d7e3ee; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 460px; padding: 24px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 22px; color: #22d3ee; }
  p { margin: 8px 0; color: #9db0c2; }
  code { background: #131a22; padding: 2px 6px; border-radius: 4px; color: #d7e3ee; word-break: break-all; }
  button { margin-top: 16px; padding: 9px 18px; border: 0; border-radius: 8px; background: #22d3ee; color: #04222a; font: inherit; font-weight: 600; cursor: pointer; }
  small { display: block; margin-top: 18px; color: #6b7d8e; }
</style>
</head>
<body>
<main>
  <h1>Não consegui abrir o Sano</h1>
  <p>Endereço: <code id="url"></code></p>
  <p id="why"></p>
  <button id="retry">Tentar de novo</button>
  <small>Tentando novamente a cada 10 segundos. Para trocar o endereço, use o ícone do Sano na bandeja → "Editar configuração" e mude <code>url</code>.</small>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const target = q.get('url') || '';
  document.getElementById('url').textContent = target;
  document.getElementById('why').textContent = q.get('why') || '';
  const retry = () => { if (target) location.href = target; };
  document.getElementById('retry').addEventListener('click', retry);
  setTimeout(retry, 10000);
</script>
</body>
</html>
