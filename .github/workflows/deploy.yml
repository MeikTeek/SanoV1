name: Deploy (Discloud)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Typecheck e build do backend
        run: npm run build --workspace backend

      - name: Typecheck e build do frontend
        run: npm run build --workspace frontend

      - name: Testes unitários
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-secret-not-used-in-production-123456
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          FRONTEND_URL: https://san0.discloud.app

      - name: Deploy to Discloud
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          APP_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$DISCLOUD_TOKEN" ]; then
            echo "::error::Configure DISCLOUD_TOKEN in the production GitHub environment secrets."
            exit 1
          fi

          APP_ID="$(sed -n 's/^ID=//p' discloud.config | head -n 1)"
          if [ -z "$APP_ID" ]; then
            echo "::error::ID is missing from discloud.config."
            exit 1
          fi

          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf "export const buildInfo = { commit: '%s', builtAt: '%s' };\n" \
            "$APP_SHA" "$BUILD_TIMESTAMP" > backend/src/build-info.ts

          npx --yes discloud-cli@2.11.2 app commit "$APP_ID"
