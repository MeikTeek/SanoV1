name: Deploy (Discloud)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Deploy to Discloud
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
        run: |
          if [ -z "$DISCLOUD_TOKEN" ]; then
            echo "::error::Configure DISCLOUD_TOKEN in the production GitHub environment secrets."
            exit 1
          fi

          APP_ID="$(sed -n 's/^ID=//p' discloud.config | head -n 1)"
          if [ -z "$APP_ID" ]; then
            echo "::error::ID is missing from discloud.config."
            exit 1
          fi

          BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf "export const buildInfo = { commit: '%s', builtAt: '%s' };\n" \
            "$GITHUB_SHA" "$BUILD_TIMESTAMP" > backend/src/build-info.ts

          npx --yes discloud-cli@2.11.2 app commit "$APP_ID"
